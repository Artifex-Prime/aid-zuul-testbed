# Tools for check.sh (https://mise.jdx.dev). mise reads this file only from this directory:
#   (cd deploy/zuul && mise exec -- ./check.sh)
[tools]
kubeconform = "0.8.0"
kustomize = "5.8.3"
shellcheck = "0.11.0"
yq = "4.54.1"
age = "1.2.1"
# The log server's and the metrics exporter's, at the versions their images in server/ have: check.sh runs the
# Caddyfile and the statsd mapping with them.
"github:caddyserver/caddy" = "2.11.9"
"github:prometheus/statsd_exporter" = "0.31.0"
