# The post node: the node image's `post` stage (../node/image/, #1633), with what a publishing job needs and nothing a
# pull request's job could ever reach, since only aid-zuul-config's post-review jobs run here (README.md).
apiVersion: v1
kind: PodTemplate
metadata:
  name: job-node
template:
  metadata:
    labels: {app.kubernetes.io/name: zuul-post-node}
  spec:
    restartPolicy: Never
    serviceAccountName: post
    # The API token runs image checks. The separate farm token gives Bazel image jobs main access.
    automountServiceAccountToken: true
    enableServiceLinks: false
    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      runAsNonRoot: true
      fsGroup: 10001
      seccompProfile: {type: RuntimeDefault}
    terminationGracePeriodSeconds: 30
    containers:
      - name: node
        # Set to the checked `post-` image's digest by apply.sh.
        image: zuul-post-node
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        # The release folder builds here, clean, as on a `swift` runner (3 CPUs and 5 GiB there, about 11 minutes).
        resources:
          requests: {cpu: 25m, memory: 128Mi, ephemeral-storage: 16Gi}
          limits: {cpu: "3", memory: 6Gi, ephemeral-storage: 16Gi}
        ports:
          - {name: ssh, containerPort: 2222}
          - {name: console, containerPort: 19885}
        readinessProbe:
          tcpSocket: {port: ssh}
          periodSeconds: 5
        volumeMounts:
          # Operator grants supply this ConfigMap before templates are applied (#1817).
          - name: scratch-control
            mountPath: /usr/local/libexec/aid-scratch-control
            subPath: aid-scratch-control
            readOnly: true
          - {name: downloads, mountPath: /var/cache/bazel, readOnly: true}
          - {name: home, mountPath: /home/zuul}
          - {name: tmp, mountPath: /tmp}
          - {name: ssh, mountPath: /etc/node-ssh, readOnly: true}
          - {name: farm, mountPath: /var/run/farm, readOnly: true}
    volumes:
      - name: scratch-control
        configMap:
          name: aid-scratch-control
          defaultMode: 0555
      - name: downloads
        persistentVolumeClaim: {claimName: bazel-downloads, readOnly: true}
      # Bazel's clean output root and repository cache for the release folder, the folder, and the job's state.
      - name: home
        emptyDir: {sizeLimit: 15Gi}
      - name: tmp
        emptyDir: {sizeLimit: 512Mi}
      # Audience-bound farm credential for Bazel image jobs, separate from the image-check API token.
      - name: farm
        projected:
          defaultMode: 0440
          sources:
            - serviceAccountToken:
                path: token
                audience: aid-build-farm
                expirationSeconds: 3600
      - name: ssh
        secret: {secretName: post-node-ssh, defaultMode: 0440}
