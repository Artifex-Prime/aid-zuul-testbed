apiVersion: v1
kind: PodTemplate
metadata:
  name: job-node
template:
  metadata:
    labels: {app.kubernetes.io/name: zuul-node}
  spec:
    restartPolicy: Never
    serviceAccountName: pr
    automountServiceAccountToken: false
    enableServiceLinks: false
    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      runAsNonRoot: true
      fsGroup: 10001
      seccompProfile: {type: RuntimeDefault}
    terminationGracePeriodSeconds: 30
    containers:
      - name: node
        # Set to the checked image's digest by the image workflow before applying.
        image: zuul-node
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 6Gi}
          limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 6Gi}
        ports:
          - {name: ssh, containerPort: 2222}
          - {name: console, containerPort: 19885}
        readinessProbe:
          tcpSocket: {port: ssh}
          periodSeconds: 5
        volumeMounts:
          - {name: downloads, mountPath: /var/cache/bazel, readOnly: true}
          - {name: home, mountPath: /home/zuul}
          - {name: tmp, mountPath: /tmp}
          - {name: ssh, mountPath: /etc/node-ssh, readOnly: true}
          - {name: farm, mountPath: /var/run/farm, readOnly: true}
    volumes:
      - name: downloads
        persistentVolumeClaim: {claimName: bazel-downloads, readOnly: true}
      - name: home
        emptyDir: {sizeLimit: 5Gi}
      - name: tmp
        emptyDir: {sizeLimit: 512Mi}
      - name: ssh
        secret: {secretName: node-ssh, defaultMode: 0440}
      - name: farm
        projected:
          defaultMode: 0440
          sources:
            - serviceAccountToken:
                path: token
                audience: aid-build-farm
                expirationSeconds: 3600
